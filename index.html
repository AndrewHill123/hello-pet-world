<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7ed">
  <title>Hello Pet World</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20342c;
      --muted: #64746b;
      --paper: #f6f7ed;
      --white: #fffefa;
      --green: #245c45;
      --green-dark: #194733;
      --mint: #dcefe1;
      --coral: #e97157;
      --yellow: #f5cd62;
      --line: #e6e9dc;
      --shadow: 0 12px 30px rgb(34 62 45 / 8%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); background-color: var(--paper);
      background-image: radial-gradient(#dbe7d7 0.75px, transparent 0.75px); background-size: 19px 19px;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #287b59; outline-offset: 3px; }
    .page-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .topbar { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--yellow); font-size: 21px; }
    .brand-name { font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 700; }
    .favourite-count { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border: 1px solid #e8d5c9; border-radius: 999px; background: #fff8f1; color: #774536; font-weight: 700; }
    .favourite-count .heart { color: var(--coral); font-size: 18px; }
    main { padding-bottom: 60px; }
    .intro { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; min-height: 228px; padding: 34px 46px; border: 1px solid #d6e5d7; border-radius: 18px; background: #e9f2df; }
    .intro::after { content: ""; position: absolute; width: 235px; height: 235px; right: 105px; top: -150px; border: 28px solid rgb(245 205 98 / 28%); border-radius: 50%; pointer-events: none; }
    .intro-copy { position: relative; z-index: 1; max-width: 600px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font: 700 42px/1.08 Georgia, "Times New Roman", serif; letter-spacing: 0; }
    .intro-copy > p:last-child { max-width: 470px; margin-bottom: 0; color: #53675b; line-height: 1.6; }
    .intro-art { position: relative; z-index: 1; width: 134px; height: 134px; display: grid; place-items: center; border-radius: 50%; background: var(--yellow); font-size: 72px; transform: rotate(7deg); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 26px 0 16px; }
    .filter-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-button { min-height: 40px; padding: 0 17px; border: 1px solid #dce2d7; border-radius: 999px; background: var(--white); color: #45574c; font-weight: 700; cursor: pointer; }
    .filter-button[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: white; }
    .recommend-button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 17px; border: 0; border-radius: 999px; background: var(--yellow); color: #3d341b; font-weight: 800; cursor: pointer; }
    .recommend-button:hover { background: #f0bf42; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 10px 0 14px; }
    .section-heading h2 { margin: 0; font: 700 25px/1.2 Georgia, "Times New Roman", serif; }
    .pet-total { margin: 0; color: var(--muted); font-size: 14px; }
    .pet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .pet-card { position: relative; overflow: hidden; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: var(--white); box-shadow: 0 3px 12px rgb(34 62 45 / 4%); transition: transform 160ms ease, box-shadow 160ms ease; }
    .pet-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .pet-open { display: block; width: 100%; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }
    .pet-visual { display: block; width: 100%; height: 156px; border-radius: 9px; }
    .pet-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 3px 3px; }
    .pet-name { margin: 0; font: 700 21px/1.15 Georgia, "Times New Roman", serif; }
    .pet-type { padding: 5px 9px; border-radius: 999px; background: var(--mint); color: var(--green-dark); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .pet-type.cat { background: #f8e4d8; color: #824d39; }
    .pet-type.fish { background: #dcecf2; color: #285d70; }
    .pet-trait { margin: 5px 3px 2px; color: var(--muted); font-size: 14px; }
    .favourite-button { position: absolute; top: 20px; right: 20px; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgb(32 52 44 / 10%); border-radius: 50%; background: white; color: #53675b; font-size: 20px; cursor: pointer; }
    .favourite-button[aria-pressed="true"] { color: #d95748; }
    .favourite-button:hover { background: #fff3ef; }
    .recommendation { display: none; align-items: center; gap: 14px; margin-top: 18px; padding: 12px 16px; border: 1px solid #eedcaa; border-radius: 12px; background: #fff8df; }
    .recommendation.is-visible { display: flex; }
    .recommendation-emoji { font-size: 30px; }
    .recommendation p { margin: 0; line-height: 1.45; }
    .recommendation strong { color: #644f16; }
    .empty-state { grid-column: 1 / -1; padding: 36px 16px; color: var(--muted); text-align: center; }
    dialog { width: min(480px, calc(100% - 32px)); max-height: min(760px, calc(100% - 32px)); padding: 0; overflow: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--white); color: var(--ink); box-shadow: 0 24px 80px rgb(20 35 26 / 24%); }
    dialog::backdrop { background: rgb(25 46 34 / 54%); backdrop-filter: blur(2px); }
    .dialog-content { padding: 16px; }
    .dialog-top { display: flex; justify-content: flex-end; }
    .dialog-close { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: white; color: var(--ink); font-size: 23px; cursor: pointer; }
    .dialog-visual { display: block; width: 100%; height: 205px; margin: 0 0 17px; border-radius: 11px; }
    .dialog-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
    .dialog-title-row h2 { margin: 0; font: 700 30px/1.1 Georgia, "Times New Roman", serif; }
    .detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
    .detail-item { padding: 11px 12px; border-radius: 9px; background: #f1f5ec; }
    .detail-item dt { margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .detail-item dd { margin: 0; font-weight: 700; line-height: 1.35; }
    .dialog-favourite { width: 100%; min-height: 46px; margin-top: 15px; border: 0; border-radius: 9px; background: var(--green); color: white; font-weight: 800; cursor: pointer; }
    .dialog-favourite:hover { background: var(--green-dark); }
    footer { padding: 18px 0 26px; border-top: 1px solid #e0e5d9; color: var(--muted); font-size: 13px; text-align: center; }
    @media (max-width: 760px) {
      .pet-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .intro { min-height: 205px; padding: 28px; }
      .intro-art { width: 100px; height: 100px; font-size: 54px; }
    }
    @media (max-width: 520px) {
      .page-shell { width: min(100% - 28px, 430px); }
      .topbar { min-height: 68px; }
      .brand-name { font-size: 17px; }
      .favourite-count { min-height: 38px; padding: 0 10px; font-size: 13px; }
      .intro { grid-template-columns: 1fr; min-height: auto; gap: 12px; padding: 24px 22px; }
      h1 { font-size: 34px; }
      .intro-art { position: absolute; right: 14px; bottom: 14px; width: 60px; height: 60px; font-size: 34px; opacity: .9; }
      .intro-copy > p:last-child { max-width: calc(100% - 24px); font-size: 14px; }
      .toolbar { align-items: stretch; padding-top: 20px; }
      .filter-group { width: 100%; }
      .filter-button { flex: 1; padding: 0 12px; }
      .recommend-button { width: 100%; }
      .pet-grid { gap: 10px; }
      .pet-card { padding: 8px; }
      .pet-visual { height: 118px; }
      .favourite-button { top: 14px; right: 14px; width: 34px; height: 34px; }
      .pet-name { font-size: 18px; }
      .pet-type { padding: 4px 7px; font-size: 10px; }
      .pet-trait { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Hello Pet World home"><span class="brand-mark" aria-hidden="true">🐾</span><span class="brand-name">Hello Pet World</span></a>
      <div class="favourite-count" role="status" aria-live="polite" aria-atomic="true"><span class="heart" aria-hidden="true">♥</span><span>Favourites</span><span id="favourite-count">0</span></div>
    </header>
    <main id="home">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy"><p class="eyebrow">A little hello goes a long way</p><h1 id="page-title">Big paws, tiny paws.<br>All kinds of joy.</h1><p>Meet six one-of-a-kind cartoon companions. Find a new favourite, or let us pick someone for you.</p></div>
        <div class="intro-art" aria-hidden="true">🐠</div>
      </section>
      <section aria-labelledby="pets-heading">
        <div class="toolbar">
          <div class="filter-group" role="group" aria-label="Filter pets by type">
            <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All pets</button>
            <button class="filter-button" type="button" data-filter="fish" aria-pressed="false">Fish</button>
            <button class="filter-button" type="button" data-filter="cat" aria-pressed="false">Cats</button>
          </div>
          <button class="recommend-button" id="recommend-button" type="button"><span aria-hidden="true">✦</span> Pick a pet for me</button>
        </div>
        <div class="section-heading"><h2 id="pets-heading">Meet the pets</h2><p class="pet-total" id="pet-total" aria-live="polite">6 lovely companions</p></div>
        <div class="pet-grid" id="pet-grid" aria-label="Pets"></div>
        <div class="recommendation" id="recommendation" role="status" aria-live="polite" aria-atomic="true"></div>
      </section>
    </main>
    <footer>Made for animal-sized smiles.</footer>
  </div>
  <dialog id="pet-dialog" aria-labelledby="dialog-name">
    <div class="dialog-content">
      <div class="dialog-top"><button class="dialog-close" id="dialog-close" type="button" aria-label="Close pet details">×</button></div>
      <div id="dialog-details"></div>
    </div>
  </dialog>

    const recommendation = document.querySelector("#recommendation");
    const favourites = new Set();
    let activeFilter = "all";
    let activePetId = null;

    function petVisual(pet, dialog = false) {
      if (pet.type !== "fish") return pet.visual.replace("pet-visual", dialog ? "dialog-visual" : "pet-visual");
      const palettes = {
        biscuit: { body: "#e97858", fin: "#f6bd65", stripe: "#fff0d4", water: "#d8edf0" },

      return `<svg class="${illustrationClass}" viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" rx="12" fill="${palettes.water}"/><circle cx="258" cy="38" r="18" fill="#f5cd62"/><path d="M42 145q18-36 4-66m12 66q17-23 13-45m185 45q-12-31-5-57m15 57q15-24 13-43" fill="none" stroke="#72a88b" stroke-width="8" stroke-linecap="round"/><circle cx="82" cy="55" r="6" fill="none" stroke="#fffefa" stroke-width="3"/><circle cx="101" cy="38" r="4" fill="none" stroke="#fffefa" stroke-width="2"/><ellipse cx="164" cy="97" rx="68" ry="43" fill="${palettes.body}"/><path d="M99 97 48 59v76z" fill="${palettes.fin}"/><path d="m155 58 26-21 17 31m-43 71 26 19 18-31" fill="${palettes.fin}"/><path d="M139 57v80m24-81v82" stroke="${palettes.stripe}" stroke-width="13"/><circle cx="198" cy="85" r="7" fill="#263a35"/><circle cx="200" cy="83" r="2" fill="#fffefa"/><path d="M207 106q10 8 18 0" fill="none" stroke="#743d36" stroke-width="3" stroke-linecap="round"/><path d="M123 92q-8 7 0 14m11-15q-8 8 0 16" fill="none" stroke="#733f39" stroke-width="3" stroke-linecap="round"/><circle cx="224" cy="55" r="5" fill="none" stroke="#fffefa" stroke-width="2"/></svg>`;
    }

    function visiblePets() {
      return activeFilter === "all" ? pets : pets.filter((pet) => pet.type === activeFilter);
    }

    function renderPets() {
      const displayedPets = visiblePets();
      petGrid.innerHTML = displayedPets.map((pet) => {
        const isFavourite = favourites.has(pet.id);
        const favouriteLabel = isFavourite ? `Remove ${pet.name} from favourites` : `Add ${pet.name} to favourites`;
        return `
          <article class="pet-card">
            <button class="pet-open" type="button" data-open="${pet.id}" aria-label="View ${pet.name}, ${pet.type}">
              ${petVisual(pet)}
              <span class="pet-meta"><span class="pet-name">${pet.name}</span><span class="pet-type ${pet.type}">${pet.type}</span></span>
              <span class="pet-trait">${pet.trait}</span>
            </button>
            <button class="favourite-button" type="button" data-favourite="${pet.id}" aria-label="${favouriteLabel}" aria-pressed="${isFavourite}">${isFavourite ? "♥" : "♡"}</button>
          </article>`;
      }).join("");
      petTotal.textContent = `${displayedPets.length} ${displayedPets.length === 1 ? "lovely companion" : "lovely companions"}`;
      favouriteCount.textContent = favourites.size;
    }

    function toggleFavourite(petId) {
      if (favourites.has(petId)) favourites.delete(petId);
      else favourites.add(petId);
      renderPets();
      if (activePetId === petId && petDialog.open) renderPetDetails(petId);
    }

    function renderPetDetails(petId) {
      const pet = pets.find((item) => item.id === petId);
      if (!pet) return;
      const isFavourite = favourites.has(pet.id);
      dialogDetails.innerHTML = `
        ${petVisual(pet, true)}
        <div class="dialog-title-row"><h2 id="dialog-name">${pet.name}</h2><span class="pet-type ${pet.type}">${pet.type}</span></div>
        <dl class="detail-list">
          <div class="detail-item"><dt>Breed</dt><dd>${pet.breed}</dd></div>
          <div class="detail-item"><dt>Age</dt><dd>${pet.age}</dd></div>
          <div class="detail-item"><dt>Personality</dt><dd>${pet.personality}</dd></div>
          <div class="detail-item"><dt>Favourite activity</dt><dd>${pet.activity}</dd></div>
        </dl>
        <button class="dialog-favourite" type="button" data-dialog-favourite="${pet.id}">${isFavourite ? "♥ Remove from favourites" : "♡ Add to favourites"}</button>`;
    }

    petGrid.addEventListener("click", (event) => {
      const favouriteButton = event.target.closest("[data-favourite]");
      if (favouriteButton) {
        toggleFavourite(favouriteButton.dataset.favourite);
        return;
      }
      const openButton = event.target.closest("[data-open]");
      if (openButton) {
        activePetId = openButton.dataset.open;
        renderPetDetails(activePetId);
        petDialog.showModal();
      }
    });

    document.querySelector(".filter-group").addEventListener("click", (event) => {
      const filterButton = event.target.closest("[data-filter]");
      if (!filterButton) return;
      activeFilter = filterButton.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button === filterButton));
      });
      renderPets();
    });

    document.querySelector("#dialog-close").addEventListener("click", () => petDialog.close());
    petDialog.addEventListener("click", (event) => {
      if (event.target === petDialog) petDialog.close();
      const favouriteButton = event.target.closest("[data-dialog-favourite]");
      if (favouriteButton) toggleFavourite(favouriteButton.dataset.dialogFavourite);
    });
    petDialog.addEventListener("close", () => { activePetId = null; });

    document.querySelector("#recommend-button").addEventListener("click", () => {
      const pet = pets[Math.floor(Math.random() * pets.length)];
      recommendation.innerHTML = `<span class="recommendation-emoji" aria-hidden="true">${pet.type === "fish" ? "🐠" : "🐱"}</span><p>Your new pal might be <strong>${pet.name}</strong>! ${pet.personality}</p>`;
      recommendation.classList.add("is-visible");
    });

    renderPets();
  </script>
</body>
</html>
